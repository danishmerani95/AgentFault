name: LangChain example

on:
  pull_request:
    paths:
      - "examples/langchain_benchmark.py"
      - "tests/examples/test_langchain_benchmark.py"
      - ".github/workflows/langchain-example.yml"
      - "README.md"
      - "docs/custom-adapters.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langchain-example:
    name: LangChain example (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "langchain-openai>=0.3,<2" "pytest>=8.3,<9"

      - name: Test adapter without model API calls
        run: pytest -q tests/examples/test_langchain_benchmark.py

      - name: Check example formatting
        run: |
          python -m pip install "ruff>=0.12,<0.13"
          ruff check examples/langchain_benchmark.py tests/examples/test_langchain_benchmark.py
