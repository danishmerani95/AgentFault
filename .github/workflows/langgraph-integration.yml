name: LangGraph integration

on:
  pull_request:
    paths:
      - "src/agentfault/integrations/langgraph.py"
      - "examples/langgraph_integration.py"
      - "tests/examples/test_langgraph_integration.py"
      - "docs/custom-adapters.md"
      - ".github/workflows/langgraph-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  langgraph-integration:
    name: LangGraph integration (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and LangGraph integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "langgraph>=1.0,<2" "pytest>=8.3,<9"

      - name: Run LangGraph integration test
        run: pytest -q tests/examples/test_langgraph_integration.py

      - name: Run example
        run: python -m examples.langgraph_integration
