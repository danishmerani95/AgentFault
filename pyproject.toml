[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cartspec"
version = "0.1.0"
description = "Open-source testing infrastructure for autonomous commerce agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "CartSpec Contributors" }
]
keywords = [
    "ai",
    "agents",
    "agentic-commerce",
    "commerce",
    "testing",
    "evaluation",
    "reliability"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
    "mypy>=1.17,<2",
]

[project.scripts]
cartspec = "cartspec.cli:main"
agentfault = "cartspec.cli:main"

[project.entry-points.pytest11]
agentfault = "cartspec.pytest_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/cartspec"]
