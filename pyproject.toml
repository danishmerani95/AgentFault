[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentfault"
version = "0.1.0"
description = "Agent Fault: open-source stateful reliability testing for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Agent Fault Contributors" }
]
keywords = [
    "ai",
    "agents",
    "agent-reliability",
    "failure-injection",
    "testing",
    "evaluation",
    "reliability"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.12,<0.13",
    "mypy>=1.17,<2",
]
examples = [
    "langchain-openai>=0.3,<2",
    "langgraph>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/danishmerani95/AgentFault"
Repository = "https://github.com/danishmerani95/AgentFault"
Issues = "https://github.com/danishmerani95/AgentFault/issues"
Changelog = "https://github.com/danishmerani95/AgentFault/blob/main/CHANGELOG.md"

[project.scripts]
agentfault = "agentfault.cli:main"

[project.entry-points.pytest11]
agentfault = "agentfault.pytest_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src/agentfault"]
